<!doctype html>
<html lang="ru">

<head>
  {{> meta }}
</head>

<body>
  <div class="dart_wrapper">
    {{> header}}
    <div class="dart_main">



      <!-- Cards -->
      <div class="cards">
        <div class="dart-container">
          <div class="cards__inner">

            <div class="cards__top">
              <h1 class="cards__title">Снеготехника для <b>охоты и рыбалки</b></h2>
              <p class="cards__text">Качественное Российское <br> производство снеготехники!</p>
            </div>

            <div class="cards__container">

              <div class="cards__item">
                <div class="cards__item__inner__mobile">
                  <p class="cards__item__name">Снегоходы</p>
                  <button type="button" class="cards__button__mobile">
                    в каталог
                    <img src="img/icons/arrow.svg" alt="">
                  </button>
                </div>
                <img src="img/cards/Сards 1.png" alt="" class="cards__img">
                <img src="img/cards/Cards 1 bg.jpg" alt="" class="cards__background">
                <img src="img/cards/Cards bg mobile.png" alt="" class="cards__background__mobile">
                <button type="button" class="cards__button">
                  Снегоходы 
                  <img src="img/icons/arrow.svg" alt="">
                </button>
              </div>

              <div class="cards__item">
                <div class="cards__item__inner__mobile">
                  <p class="cards__item__name">Квадроциклы</p>
                  <button type="button" class="cards__button__mobile">
                    в каталог
                    <img src="img/icons/arrow.svg" alt="">
                  </button>
                </div>
                <img src="img/cards/Cards 2.png" alt="" class="cards__img">
                <img src="img/cards/Cards 2 bg.jpg" alt="" class="cards__background">
                <img src="img/cards/Cards bg mobile.png" alt="" class="cards__background__mobile">
                <button type="button" class="cards__button">
                  Квадроциклы 
                  <img src="img/icons/arrow.svg" alt="">
                </button>
              </div>

              <div class="cards__item">
                <div class="cards__item__inner__mobile">
                  <p class="cards__item__name">Погрузчики</p>
                  <button type="button" class="cards__button__mobile">
                    в каталог
                    <img src="img/icons/arrow.svg" alt="">
                  </button>
                </div>
                <img src="img/cards/Cards 3.png" alt="" class="cards__img">
                <img src="img/cards/Cards 3 bg.jpg" alt="" class="cards__background">
                <img src="img/cards/Cards bg mobile.png" alt="" class="cards__background__mobile">
                <button type="button" class="cards__button">
                  Погрузчики 
                  <img src="img/icons/arrow.svg" alt="">
                </button>
              </div>


            </div>

          </div>
        </div>
      </div>

      <!-- Offers -->
      <div class="offers">
        <div class="dart-container">
          <div class="offers__inner">
            <div class="offers__top">
              <h3 class="offers__title">Выгодные <b>акции</b> и предложения для вас</h3>
              <div class="swiper__buttons">
                <div class="swiper-button-prev">
                  <img src="img/icons/arrow-left.svg" alt="">
                </div>
                <div class="swiper-button-next">
                  <img src="img/icons/arrow-right.svg" alt="">
                </div>
              </div>
            </div>

              <div class="offers__swiper">
                <div class="swiper">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <div class="offers__item"> <!-- переделать! -->
                        <div class="offers__item__left">
                          <div class="offers__item__title">Приведи друга и получи 5000₽ на карту</div>
                          <div class="offers__item__text">Или кофр в подарок</div>
                        </div>
                        <a class="offers__item__right" href="#">
                          <img src="img/icons/plus-blue.svg" alt="" class="offers__item__icon">
                        </a>
                      </div>
                    </div>
                    <div class="swiper-slide">
                      
                    </div>
                    <div class="swiper-slide">
                      
                    </div>
                    <div class="swiper-slide">
                      
                    </div>
                    <div class="swiper-slide">
                      
                    </div>
                    <div class="swiper-slide">
                      
                    </div>
                  </div>
                </div>
              </div>

          </div>
        </div>
      </div>



    </div>
    {{> footer}}
  </div>
  {{> scripts}}
</body>
</html>
